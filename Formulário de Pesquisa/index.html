<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pesquisa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Pesquisa de Experiência Dev</h1>
            <p id="description">Conte-nos um pouco sobre sua jornada no mundo da programação!</p>
        </header>

        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Nome completo:</label>
                <input type="text" id="name" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label id="email-label" for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu melhor e-mail" required>
            </div>

            <div class="form-group">
                <label id="number-label" for="number">Idade (opcional):</label>
                <input type="number" id="number" min="10" max="99" placeholder="Ex: 25">
            </div>

            <div class="form-group">
                <label for="dropdown">Qual sua stack principal?</label>
                <select id="dropdown" required>
                    <option disabled selected value="">Selecione uma opção</option>
                    <option value="frontend">Front-end</option>
                    <option value="backend">Back-end</option>
                    <option value="fullstack">Fullstack</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <p>Qual seu nível de senioridade?</p>
                <label>
                    <input type="radio" name="user-level" value="junior" checked> Júnior
                </label>
                <label>
                    <input type="radio" name="user-level" value="pleno"> Pleno
                </label>
                <label>
                    <input type="radio" name="user-level" value="senior"> Sênior
                </label>
            </div>

            <div class="form-group">
                <p>O que você deseja aprender em 2024? (Selecione várias)</p>
                <label>
                    <input type="checkbox" name="skills" value="react"> React / Next.js
                </label>
                <label>
                    <input type="checkbox" name="skills" value="node"> Node.js / Express
                </label>
                <label>
                    <input type="checkbox" name="skills" value="python"> Python / IA
                </label>
                <label>
                    <input type="checkbox" name="skills" value="typescript"> TypeScript
                </label>
            </div>

            <div class="form-group">
                <label for="comments">Algum comentário ou sugestão?</label>
                <textarea id="comments" name="comments" placeholder="Escreva aqui seu comentário..."></textarea>
            </div>

            <button type="submit" id="submit">Enviar Respostas</button>
        </form>
    </div>
</body>
</html>
