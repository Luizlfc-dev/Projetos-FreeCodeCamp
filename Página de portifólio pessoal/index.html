<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio Pessoal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="navbar">
        <ul>
            <li><a href="#welcome-section">Início</a></li>
            <li><a href="#projects">Projetos</a></li>
            <li><a href="#contact">Contato</a></li>
        </ul>
    </nav>

    <section id="welcome-section">
        <h1>Olá, eu sou um Desenvolvedor Web</h1>
        <p>Transformando ideias em código e interfaces modernas.</p>
    </section>

    <section id="projects">
        <h2 class="projects-header">Alguns dos meus projetos</h2>
        
        <div class="projects-grid">
            <a href="https://codepen.io/exemplo1" target="_blank" class="project-tile">
                <img src="https://via.placeholder.com/300" alt="Projeto de Tributo" class="project-image">
                <p class="project-title">Página de Tributo</p>
            </a>

            <a href="https://codepen.io/exemplo2" target="_blank" class="project-tile">
                <img src="https://via.placeholder.com/300" alt="Formulário" class="project-image">
                <p class="project-title">Formulário de Pesquisa</p>
            </a>
        </div>
    </section>

    <section id="contact">
        <h2>Vamos trabalhar juntos?</h2>
        <div class="contact-links">
            <a id="profile-link" href="https://github.com/seu-usuario" target="_blank">GitHub</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 - Criado para o desafio freeCodeCamp</p>
    </footer>
</body>
</html>
